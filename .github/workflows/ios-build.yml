name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/example/ios/**'
      - 'apps/example/Gemfile'
      - 'apps/example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'packages/player/cpp/**'
      - 'packages/player/ios/**'
      - 'packages/audio-session/ios/**'
      - 'packages/media-session/ios/**'
      - 'packages/cast/ios/**'
      - '**/Podfile.lock'
      - '**/package-lock.json'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/example/ios/**'
      - 'apps/example/Gemfile'
      - 'apps/example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'packages/player/cpp/**'
      - 'packages/player/ios/**'
      - 'packages/audio-session/ios/**'
      - 'packages/media-session/ios/**'
      - 'packages/cast/ios/**'
      - '**/Podfile.lock'
      - '**/package-lock.json'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      # Xcode 26.2 (iOS 26.2 SDK), NOT the runner default (16.4 / iOS 18.5 SDK).
      # google-cast-sdk 4.8.6 ships a *static* GoogleCast.xcframework whose
      # object files declare `LC_BUILD_VERSION … minos 16.0, sdk 26.2` and whose
      # M3CMaterialGlassEffectView.o references `UIGlassEffect` — a UIKit class
      # introduced in iOS 26.0 (developer.apple.com/documentation/uikit/uiglasseffect).
      # React Native's own `-ObjC` in OTHER_LDFLAGS force-loads every object out
      # of static archives, so that object cannot be dead-stripped, and against
      # the 18.5 SDK the app fails to link with
      #   Undefined symbols: "_OBJC_CLASS_$_UIGlassEffect", referenced from
      #   GoogleCast[x86_64](M3CMaterialGlassEffectView.o)
      # (run 31784085458). The vendor built 4.8.6 with the 26.2 SDK, so 26.2 is
      # the floor that can link it; the macOS-15 image ships 26.0.1/26.1.1/26.2/26.3
      # (actions/runner-images images/macos/macos-15-Readme.md). This is a
      # consumer-visible requirement of installing @timbre/cast, not just ours.
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/example

      - name: Install xcpretty
        run: gem install xcpretty

      # Prebuilt libmpv (audio, LGPL "default" flavour). `pod install` runs this
      # same script itself, but priming it here gives us a cached download and a
      # dedicated, readable failure when the pinned artifact/checksum is wrong.
      - name: Cache prebuilt libmpv
        uses: actions/cache@v6
        with:
          path: packages/player/ios/.cache/libmpv
          key: ${{ runner.os }}-libmpv-ios-${{ hashFiles('packages/player/ios/libmpv.pin') }}

      - name: Fetch prebuilt libmpv
        run: ./packages/player/ios/fetch-libmpv.sh

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods/repos
            apps/example/ios/Pods
          # Podfile.lock is not committed, so hashing it alone would yield a
          # constant key and a never-invalidated Pods/ cache. Key on what
          # actually determines the pod graph instead.
          key: ${{ runner.os }}-pods-${{ hashFiles('packages/*/*.podspec', 'packages/player/ios/libmpv.pin', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        working-directory: apps/example/ios
        run: pod install

      # The libmpv xcframeworks are vendored by `RnMediaPlayer.podspec` and are
      # the one part of the graph a podspec mistake can silently drop (CocoaPods
      # filters `vendored_frameworks` through `exclude_files`, so an over-broad
      # exclude pattern removes them without a word). Assert here rather than
      # discovering it four minutes later as a wall of undefined `mpv_*`.
      - name: Verify libmpv is linked into the app target
        working-directory: apps/example/ios
        run: |
          xcconfig="Pods/Target Support Files/Pods-RnMediaPlayerExample/Pods-RnMediaPlayerExample.debug.xcconfig"
          missing=0
          for framework in Mpv Avcodec Avformat Avutil Swresample; do
            grep -q -- "-framework \"${framework}\"" "$xcconfig" || {
              echo "::error::${xcconfig} is missing -framework \"${framework}\" — RnMediaPlayer's vendored xcframeworks did not reach the app target"
              missing=1
            }
          done
          grep -q 'PODS_XCFRAMEWORKS_BUILD_DIR}/RnMediaPlayer' "$xcconfig" || {
            echo "::error::${xcconfig} has no \${PODS_XCFRAMEWORKS_BUILD_DIR}/RnMediaPlayer framework search path"
            missing=1
          }
          if [ "$missing" -ne 0 ]; then
            echo "--- OTHER_LDFLAGS / FRAMEWORK_SEARCH_PATHS as generated:"
            grep -E '^(OTHER_LDFLAGS|FRAMEWORK_SEARCH_PATHS)' "$xcconfig"
            exit 1
          fi
          echo "libmpv xcframeworks are linked into the app target."

      # `xcpretty` swallows the body of linker diagnostics (the actual list of
      # undefined symbols never reaches the console), so the raw xcodebuild
      # output is tee'd to a file that the failure/artifact steps below mine.
      - name: Build App
        working-directory: apps/example/ios
        run: |
          set -o pipefail && xcodebuild \
            -derivedDataPath build \
            -workspace RnMediaPlayerExample.xcworkspace \
            -scheme RnMediaPlayerExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-raw.log | xcpretty

      - name: Diagnose build failure
        if: failure()
        working-directory: apps/example/ios
        run: |
          echo "::group::Errors"
          grep -n -E "error:|Undefined symbols|symbol\(s\) not found|framework not found|ld: " xcodebuild-raw.log | head -100 || true
          echo "::endgroup::"

          echo "::group::Undefined symbol details"
          awk '/Undefined symbols/,/ld: symbol\(s\) not found/' xcodebuild-raw.log | head -200 || true
          echo "::endgroup::"

          echo "::group::Link (Ld) invocation"
          grep -n -m1 -A 3 "^ *Ld " xcodebuild-raw.log || true
          awk '/^ *Ld .*RnMediaPlayerExample/{found=1} found{print; if (++n > 12) exit}' xcodebuild-raw.log || true
          echo "::endgroup::"

          echo "::group::Aggregate xcconfig (linker flags the app target actually gets)"
          for f in "Pods/Target Support Files/Pods-RnMediaPlayerExample/"*.xcconfig; do
            echo "----- $f"; cat "$f"
          done
          echo "::endgroup::"

          echo "::group::Unpacked XCFramework slices"
          find build/Build/Products -maxdepth 3 -name '*.framework' -o -maxdepth 3 -name 'XCFrameworkIntermediates' | head -50 || true
          ls -la build/Build/Products/Debug-iphonesimulator 2>/dev/null | head -60 || true
          echo "::endgroup::"

          echo "::group::Last 150 lines of raw log"
          tail -150 xcodebuild-raw.log
          echo "::endgroup::"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/example/ios/xcodebuild-raw.log
            apps/example/ios/Podfile.lock
            apps/example/ios/Pods/Target Support Files/Pods-RnMediaPlayerExample/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaPlayer/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaAudioSession/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaMediaSession/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaCast/*.xcconfig
