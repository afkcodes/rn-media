name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/example/ios/**'
      - 'apps/example/Gemfile'
      - 'apps/example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'packages/player/cpp/**'
      - 'packages/player/ios/**'
      - 'packages/audio-session/ios/**'
      - 'packages/media-session/ios/**'
      - '**/Podfile.lock'
      - '**/package-lock.json'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/example/ios/**'
      - 'apps/example/Gemfile'
      - 'apps/example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'packages/player/cpp/**'
      - 'packages/player/ios/**'
      - 'packages/audio-session/ios/**'
      - 'packages/media-session/ios/**'
      - '**/Podfile.lock'
      - '**/package-lock.json'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App
    runs-on: macOS-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 16.4

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/example

      - name: Install xcpretty
        run: gem install xcpretty

      # Prebuilt libmpv (audio, LGPL "default" flavour). `pod install` runs this
      # same script itself, but priming it here gives us a cached download and a
      # dedicated, readable failure when the pinned artifact/checksum is wrong.
      - name: Cache prebuilt libmpv
        uses: actions/cache@v4
        with:
          path: packages/player/ios/.cache/libmpv
          key: ${{ runner.os }}-libmpv-ios-${{ hashFiles('packages/player/ios/libmpv.pin') }}

      - name: Fetch prebuilt libmpv
        run: ./packages/player/ios/fetch-libmpv.sh

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            apps/example/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install Pods
        working-directory: apps/example/ios
        run: pod install

      # `xcpretty` swallows the body of linker diagnostics (the actual list of
      # undefined symbols never reaches the console), so the raw xcodebuild
      # output is tee'd to a file that the failure/artifact steps below mine.
      - name: Build App
        working-directory: apps/example/ios
        run: |
          set -o pipefail && xcodebuild \
            -derivedDataPath build \
            -workspace RnMediaPlayerExample.xcworkspace \
            -scheme RnMediaPlayerExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild-raw.log | xcpretty

      - name: Diagnose build failure
        if: failure()
        working-directory: apps/example/ios
        run: |
          echo "::group::Errors"
          grep -n -E "error:|Undefined symbols|symbol\(s\) not found|framework not found|ld: " xcodebuild-raw.log | head -100 || true
          echo "::endgroup::"

          echo "::group::Undefined symbol details"
          awk '/Undefined symbols/,/ld: symbol\(s\) not found/' xcodebuild-raw.log | head -200 || true
          echo "::endgroup::"

          echo "::group::Link (Ld) invocation"
          grep -n -m1 -A 3 "^ *Ld " xcodebuild-raw.log || true
          awk '/^ *Ld .*RnMediaPlayerExample/{found=1} found{print; if (++n > 12) exit}' xcodebuild-raw.log || true
          echo "::endgroup::"

          echo "::group::Aggregate xcconfig (linker flags the app target actually gets)"
          for f in "Pods/Target Support Files/Pods-RnMediaPlayerExample/"*.xcconfig; do
            echo "----- $f"; cat "$f"
          done
          echo "::endgroup::"

          echo "::group::Unpacked XCFramework slices"
          find build/Build/Products -maxdepth 3 -name '*.framework' -o -maxdepth 3 -name 'XCFrameworkIntermediates' | head -50 || true
          ls -la build/Build/Products/Debug-iphonesimulator 2>/dev/null | head -60 || true
          echo "::endgroup::"

          echo "::group::Last 150 lines of raw log"
          tail -150 xcodebuild-raw.log
          echo "::endgroup::"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/example/ios/xcodebuild-raw.log
            apps/example/ios/Podfile.lock
            apps/example/ios/Pods/Target Support Files/Pods-RnMediaPlayerExample/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaPlayer/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaAudioSession/*.xcconfig
            apps/example/ios/Pods/Target Support Files/RnMediaMediaSession/*.xcconfig
