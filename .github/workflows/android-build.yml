name: Build Android

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'apps/example/android/**'
      - 'packages/player/nitrogen/generated/shared/**'
      - 'packages/player/nitrogen/generated/android/**'
      - 'packages/audio-session/nitrogen/generated/shared/**'
      - 'packages/audio-session/nitrogen/generated/android/**'
      - 'packages/media-session/nitrogen/generated/shared/**'
      - 'packages/media-session/nitrogen/generated/android/**'
      - 'packages/cast/nitrogen/generated/shared/**'
      - 'packages/cast/nitrogen/generated/android/**'
      - 'packages/player/cpp/**'
      - 'packages/player/android/**'
      - 'packages/audio-session/android/**'
      - 'packages/media-session/android/**'
      - 'packages/cast/android/**'
      # The Kotlin resumption reader duplicates this file's
      # `PERSISTENCE_SCHEMA_VERSION`, and `SchemaVersionSyncTest` is what keeps
      # the two in step — so a change here has to run this workflow even though
      # nothing Android moved.
      - 'packages/media-session/src/persistence.ts'
      - 'scripts/check-workspace-links.mjs'
      - '**/package-lock.json'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
    paths:
      - '.github/workflows/android-build.yml'
      - 'apps/example/android/**'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/android/**'
      - 'packages/player/cpp/**'
      - 'packages/player/android/**'
      - 'packages/audio-session/android/**'
      - 'packages/media-session/android/**'
      - 'packages/cast/android/**'
      - 'packages/media-session/src/persistence.ts'
      - 'scripts/check-workspace-links.mjs'
      - '**/package-lock.json'
      - '**/react-native.config.js'
      - '**/nitro.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Example App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Before anything is compiled: does every workspace package actually
      # resolve from the example app? On 2026-08-14 `@timbre/cast` passed
      # every gate we own and shipped in nothing, because its workspace link
      # was missing and the build simply succeeded WITHOUT it. Autolinking
      # skipping a package is not an error — it is a smaller APK. This step is
      # the only thing between that and a green pipeline.
      - name: Check workspace links
        run: node scripts/check-workspace-links.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build
        working-directory: apps/example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      # …and the same question asked of the ARTIFACT, which is where the answer
      # actually matters. Every package's Android module produces
      # `lib/<abi>/lib<PACKAGE_NAME>.so`, and `lib/` entries survive R8
      # untouched, so this is a name lookup in the APK's zip directory — no
      # SDK tools, nothing to be flaky about. The link check above can only
      # prove the tree is right; this proves the APK is.
      - name: Check the APK contains every package
        run: >-
          node scripts/check-workspace-links.mjs
          --apk apps/example/android/app/build/outputs/apk/debug/app-debug.apk

      # A build is not a check. `lintRelease` was broken at HEAD for days while
      # this workflow stayed green, because assembling never runs lint — the
      # "a green pipeline only proves what it actually runs" trap, in this repo.
      #
      # Runs in this job rather than a separate one so it reuses the Gradle
      # cache and the already-downloaded libmpv binaries, and so the required
      # status check stays a single name.
      #
      # Scoped to one ABI on purpose: lint pulls in `externalNativeBuild`, so
      # without this it would configure and build CMake for all four
      # architectures to produce a report that does not depend on any of them.
      - name: Run Android lint (library modules)
        working-directory: apps/example/android
        run: >-
          ./gradlew
          :timbre_player:lintRelease
          :timbre_audio-session:lintRelease
          :timbre_media-session:lintRelease
          :timbre_cast:lintRelease
          -PreactNativeArchitectures=arm64-v8a
          --no-daemon --build-cache

      # The JVM half of `media-session`: the resumption record parser, the
      # channel-priority merge, and the guard that keeps Kotlin's
      # `SCHEMA_VERSION` equal to `persistence.ts`'s. Plus `cast`'s framework-
      # constant mappings (`CastMappingTest`). No device, no emulator, no CMake
      # — these tasks do not touch the NDK.
      #
      # `testDebugUnitTest`, not `testReleaseUnitTest`: AGP 9 (which RN 0.87
      # brings in — 9.2.1) only creates unit-test tasks for `testBuildType`,
      # which defaults to `debug`, so `testReleaseUnitTest` no longer exists and
      # naming it fails the build outright ("task not found in project"). No
      # coverage is lost — these are pure-JVM tests over parsers and constant
      # maps, unit tests never see R8, and the release variant only ever
      # differed by shrinking.
      - name: Run Kotlin unit tests (media-session, cast)
        working-directory: apps/example/android
        run: >-
          ./gradlew
          :timbre_media-session:testDebugUnitTest
          :timbre_cast:testDebugUnitTest
          -PreactNativeArchitectures=arm64-v8a
          --no-daemon --build-cache

      - name: Upload lint and unit-test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-and-test-reports
          path: |
            packages/*/android/build/reports/lint-results-*.html
            packages/*/android/build/reports/lint-results-*.txt
            packages/media-session/android/build/reports/tests/**
            packages/cast/android/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Gradle daemon
        working-directory: apps/example/android
        run: ./gradlew --stop
