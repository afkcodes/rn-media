name: Release

# Changesets flow. A push to main that carries pending changesets opens (or
# updates) a "Version Packages" PR; merging THAT PR — a push to main with the
# version bumps and no remaining changesets — publishes the changed packages to
# npm and cuts their GitHub releases + tags. Nothing publishes from a laptop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version PR, create tags + releases
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # lib/ is builder-bob output and gitignored, so it must exist on disk
      # before `changeset publish` runs `npm publish` per package.
      - name: Build packages
        run: npm run build

      - name: Create release PR or publish
        uses: changesets/action@v2
        with:
          version: npm run changeset:version
          publish: npx changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
