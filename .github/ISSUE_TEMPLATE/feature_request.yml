name: Feature request
description: Propose something the library should do
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Two things worth checking first: the
        [Roadmap](https://github.com/afkcodes/timbre/blob/main/README.md#roadmap) (it may already be queued)
        and [`ARCHITECTURE.md`](https://github.com/afkcodes/timbre/blob/main/ARCHITECTURE.md) (it may already
        have been decided against, with reasons). Contradicting a decision is
        fine — just say which one, so the discussion starts in the right place.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to build, and where does the library get in the
        way? Concrete beats abstract.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: >-
        The API shape you have in mind, if you have one. Note which package it
        belongs to — `media-session` must stay player-agnostic, and `player`
        never links video code.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >-
        `player.command()` / `setProperty*` reach anything mpv can do, and the
        session packages accept any structurally-compatible engine. If one of
        those got you close, say where it stopped.
    validations:
      required: false
