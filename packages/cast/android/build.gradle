buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: "com.facebook.react"
apply from: '../nitrogen/generated/android/RnMediaCast+autolinking.gradle'
apply from: "./fix-prefab.gradle"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RnMediaCast_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RnMediaCast_" + name]).toInteger()
}

android {
  namespace "com.rnmediacast"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared",
                  "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  // Local JVM unit tests for the pure-logic Kotlin in this module: the
  // framework-constant translations in `CastMapping` (player state, idle
  // reason, repeat mode, cast state, second↔millisecond conversion). All are
  // decided by data over compile-time constants, so they run on a plain JVM
  // with nothing stubbed — the media-session MappingTest pattern.
  //
  // Consumer-invisible by construction: `src/test` is compiled by the
  // `test*UnitTest` tasks alone and the `testImplementation` dependencies
  // belong to no published variant.
  testOptions {
    unitTests {
      // The mockable android.jar throws from every method unless this is set.
      // The classes under test are pure Kotlin; the only Android surface a
      // test can even reach transitively is class-loading of GMS constant
      // holders, for which defaulted stubs are the honest answer.
      returnDefaultValues = true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        // React Codegen files
        "${project.buildDir}/generated/source/codegen/java"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // Official Google Cast sender framework (pin + provenance note in
  // gradle.properties). `api`, not `implementation`: the app's manifest names
  // OUR `OptionsProvider` (a framework type) and an app that registers its
  // own `SessionProvider` or `SessionTransferCallback` needs the framework
  // types on its compile classpath — and two Cast framework versions in one
  // app is a guaranteed `NoSuchMethodError`, same reasoning as media3 in
  // @timbre/media-session.
  //
  // The framework itself is a thin shell: the real implementation is a
  // dynamite module loaded from Google Play services at runtime, which is why
  // absence is a runtime capability answer (`'unavailable'`), never a build
  // or install failure.
  api "com.google.android.gms:play-services-cast-framework:${getExtOrDefault('castFrameworkVersion')}"

  // androidx.mediarouter comes in transitively from the framework (22.3.1
  // declares 1.8.0-beta01 at compile scope); the discovery controller and
  // chooser dialog use it directly but deliberately do NOT re-declare it —
  // pinning a second version under the framework would be the same two-
  // versions hazard the `api` note above avoids.

  // ---- local JVM unit tests only (see `testOptions` above) ----------------
  testImplementation "junit:junit:4.13.2"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RnMediaCast"
  codegenJavaPackageName = "com.rnmediacast"
}
