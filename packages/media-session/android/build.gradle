buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.8.0"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: "com.facebook.react"
apply from: '../nitrogen/generated/android/RnMediaMediaSession+autolinking.gradle'
apply from: "./fix-prefab.gradle"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["RnMediaMediaSession_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["RnMediaMediaSession_" + name]).toInteger()
}

android {
  namespace "com.rnmediamediasession"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared",
                  "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
        "META-INF",
        "META-INF/**",
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  // Local JVM unit tests for the pure-logic Kotlin in this module: the
  // resumption record parser (`ResumptionStore`) and the channel-priority merge
  // (`Snapshot`). Both are decided by data, run before any JavaScript exists in
  // the process, and were previously only observable on a device.
  //
  // Consumer-invisible by construction: `src/test` is compiled by the
  // `test*UnitTest` tasks alone (no `assemble*` reaches it) and the
  // `testImplementation` dependencies belong to no published variant — they are
  // absent from `releaseApiElements`/`releaseRuntimeElements`, which is
  // everything an app consuming this module sees.
  testOptions {
    unitTests {
      // The `android.jar` on a unit-test classpath is the *mockable* stub jar:
      // every method throws `RuntimeException("Stub!")` unless this is set, in
      // which case it returns 0/null/false instead. Only two Android calls are
      // reachable from the code under test — `Log.w` (a diagnostic) and
      // `SystemClock.elapsedRealtime()` (the anchor origin, which the tests
      // assert relative to, never absolutely) — so a defaulted stub is the
      // honest answer for both. `org.json` is *not* left to the stub; a real
      // implementation is on the test classpath below.
      returnDefaultValues = true

      all { test ->
        // The schema-version guard reads `../src/persistence.ts`. A Test task's
        // working directory is not a contract worth resting on, so the package
        // root is handed over explicitly.
        test.systemProperty 'rnMedia.packageRoot', project.projectDir.parentFile.absolutePath
      }
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        // React Codegen files
        "${project.buildDir}/generated/source/codegen/java"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // media3 `MediaLibraryService` + `SimpleBasePlayer` + `DefaultMediaNotificationProvider`.
  //
  // `media3-session` is the ONLY media3 artifact needed: it declares `media3-common`
  // (which is where `SimpleBasePlayer` and `Player.Commands` live) at compile scope,
  // and it pulls Guava in transitively for `ListenableFuture`/`Futures`/`SettableFuture`.
  // `media3-exoplayer` is deliberately NOT a dependency — this package never plays
  // anything itself; the app's player does (PLAN §5.2, "player-agnostic by contract").
  //
  // `api`, not `implementation`: a consumer that wants to talk to the session with its
  // own `MediaController` (or add an Android Auto browse tree later) needs the media3
  // types on its compile classpath, and two different media3 versions in one app is a
  // guaranteed `NoSuchMethodError`.
  api "androidx.media3:media3-session:${getExtOrDefault('media3Version')}"

  // ---- local JVM unit tests only (see `testOptions` above) ----------------
  testImplementation "junit:junit:4.13.2"
  // A *real* `org.json`. The mockable `android.jar` ships stubs of these exact
  // classes, so without this every `JSONObject` in a unit test parses to
  // nothing and the parser tests would pass by agreeing about emptiness.
  // Declared dependencies precede the mockable jar on the unit-test runtime
  // classpath, so this one wins (verified by the tests themselves: they assert
  // parsed values, which a stub cannot produce).
  testImplementation "org.json:json:20260719"
}

react {
  jsRootDir = file("../src/")
  libraryName = "RnMediaMediaSession"
  codegenJavaPackageName = "com.rnmediamediasession"
}
