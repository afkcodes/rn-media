import java.security.MessageDigest
import java.util.zip.ZipFile

/*
 * Prebuilt libmpv (audio-only, LGPL flavour) for Android.
 *
 * Source of truth: https://github.com/afkcodes/libmpv-android-audio-build/releases
 * — our fork of media-kit/libmpv-android-audio-build, which exists only so the
 * ffmpeg configure flags are ours (upstream's audio flavour ships no HLS
 * demuxer). The owner is a field in the pin block below, not a constant.
 * Each release ships one `.jar` per ABI containing `lib/<abi>/libmpv.so`.
 * Flavours are `default` (mpv --enable-lgpl + LGPL ffmpeg), `full` and
 * `encoders-gpl`. We use `default` only — see CLAUDE.md "Dependency policy".
 *
 * The integration mirrors media_kit's proven Gradle pattern
 * (media-kit/media-kit → libs/android/media_kit_libs_android_audio/android/build.gradle):
 * download the per-ABI jars at build time, verify a pinned checksum, expose the
 * `.so`s to the build. Two deliberate departures from that prior art:
 *   1. SHA-256 instead of MD5 (MD5 collisions are trivially constructible; a
 *      checksum pin is a supply-chain control, so it must be a real hash).
 *   2. The `.so`s are *extracted* rather than handed to AGP as a jar
 *      dependency, because CMake also has to link against them (media_kit
 *      dlopen()s libmpv at runtime and never links it, so a jar sufficed there).
 */

// ─────────────────────────────────────────────────────────────────────────────
// THE PIN. Bumping libmpv = editing this block and nothing else.
// Checksums come from the GitHub release asset digests and are re-verified on
// every download; a mismatch is a hard build failure, never a warning.
// ─────────────────────────────────────────────────────────────────────────────
ext.libmpv = [
    // GitHub owner of `libmpv-android-audio-build`. This is part of the pin, not
    // a constant: we ship from our own fork so that the ffmpeg configure flags
    // are under our control (see `release` below). Upstream is 'media-kit'.
    owner     : 'afkcodes',
    // Release tag in `<owner>/libmpv-android-audio-build`.
    //
    // v1.1.9-rnmedia.2 = upstream v1.1.9 with ffmpeg *configure flags* added on
    // branch `rn-media-hls`. Same source tree throughout (mpv 0.35.1, ffmpeg
    // n6.0, NDK 27.1.12297006, all upstream patches incl. `mpv_lavc_set_java_vm`);
    // the exported symbol set is byte-for-byte identical to upstream v1.1.9, so
    // none of this is an ABI change. Still LGPLv3: no `--enable-gpl`, no
    // `--enable-nonfree`, no new external library.
    //
    // …rnmedia.1 — `--enable-demuxer=hls --enable-demuxer=mpegts`.
    //   Upstream's audio flavour builds ffmpeg with `--disable-demuxers` plus an
    //   allow-list that carried neither, so every `.m3u8` failed with
    //   `unsupported-format` on-device. `--enable-protocol=hls` was present, but
    //   that is the deprecated `hls://` *protocol* and is useless without the
    //   demuxer.
    //
    // …rnmedia.2 — 16 `--enable-filter=` flags (the EQ/DSP set behind
    //   `Player.setAudioFilters`). Exactly the same trap one layer up:
    //   `--disable-filters` plus an allow-list that held only `overlay` and
    //   `equalizer`, while `--enable-avfilter` and mpv's lavfi bridge were
    //   already compiled — `af=` resolved through `avfilter_get_by_name()` and
    //   found nothing. Added: aresample, aformat, anull, volume, bass, treble,
    //   lowpass, highpass, anequalizer, superequalizer, firequalizer,
    //   acompressor, alimiter, dynaudnorm, loudnorm, crossfeed.
    //   `aresample` is not a convenience: libavfilter auto-inserts it whenever
    //   two pads cannot agree a sample format, and every filter above pins a
    //   different one — without it a chain fails with "'aresample' filter not
    //   present, cannot convert formats". +104 KB/ABI stripped (+1.7 %).
    //   All 16 are LGPL: every GPL-gated filter in ffmpeg n6.0 is a video filter.
    //
    // …rnmedia.3 — a SOURCE PATCH, the fork's first
    //   (`buildscripts/patches/mpv/004.rn_media_pcm_tap.patch`): a PCM tap on
    //   mpv's client API, behind `player.visualizer`. Two new properties —
    //   `pcm-tap` (int, rw; samples per channel to retain, 0 = off) and
    //   `pcm-tap-frame` (node, ro; interleaved float32 in a byte array) — and
    //   no new exported symbol, so the ABI is unchanged: the export set is
    //   byte-identical to rnmedia.2 on all four ABIs (53 dynamic symbols).
    //   The tap sits at the end of `ao_post_process_data()`, after the filter
    //   chain and after mpv's software gain, so it reports what is audible;
    //   disarmed it costs one atomic load per device chunk and allocates
    //   nothing. +2.4 KB/ABI (+0.037 %). The identical patch file is in
    //   libmpv-darwin-build — one engine, not an Android feature.
    //   Proof it is in the SHIPPED .so (never the build log — see
    //   ARCHITECTURE → Platform truths, the waf stale-relink trap): the string
    //   `[rn-media] pcm-tap window=`, which only the patched player/command.c
    //   emits, is present in every stripped artifact.
    //
    // …rnmedia.4 — `005.mpv_dup_node_byte_array.patch`, without which rnmedia.3's
    //   tap is unreadable. Every MPV_FORMAT_NODE property is copied out of its
    //   handler through copy_node() -> dup_node(), and mpv 0.35.1's dup_node has
    //   no MPV_FORMAT_BYTE_ARRAY arm: the node falls into `default:` and is
    //   stamped `(mpv_format)-1`. On device the map's scalars arrived intact
    //   (channels 2, frames 2048, seq 1082) while `samples` came through empty —
    //   which looks exactly like a tap with no audio rather than a copy that
    //   dropped a field. The fix is upstream mpv's own, copied verbatim; it
    //   landed in mpv 0.36.0, so the darwin fork needs nothing and stays on
    //   v0.7.2-rnmedia.3. That asymmetry is a version fact, not a platform one.
    //   +2.6 KB/ABI total (+0.04 %); export set still byte-identical (53 syms).
    release   : 'v1.1.9-rnmedia.4',
    // Asset flavour. LGPL only — do NOT switch to 'full'/'encoders-gpl'.
    flavor    : 'default',
    // mpv version inside that release (buildscripts/include/depinfo.sh → v_mpv).
    // Must match the tag the headers in cpp/third_party/mpv are vendored from.
    // Unchanged from v1.1.9 — the delta is ffmpeg flags, not an mpv bump.
    mpvVersion: '0.35.1',
    // FFmpeg version inside that release. Machine-readable for
    // scripts/check-upstream.mjs, which parses this block — until now FFmpeg
    // existed here only as prose in the comments above.
    ffmpegVersion: 'n6.0',
    // SHA-256 of `<flavor>-<abi>.jar`.
    sha256    : [
        'arm64-v8a'  : '291e3f92c571cb87c780d8c79566ae14a129811761f4027db0315adb03ceed47',
        'armeabi-v7a': '68a75d7d6256f07932b8cfd77e2a295334f7f6dc91d945f0c0f81b214462a76e',
        'x86'        : 'de8a0bb26b199ac4281909ca9a878978fb745ebf406b077a8f75057ff2a74f32',
        'x86_64'     : '8b8094b1e9033741ba8c3d81a3da3631016f7eb71a150f2da13dab8fc60918eb',
    ],
]

// Downloaded jars live in the Gradle user home, not in `build/`: they survive
// `./gradlew clean` and are shared across checkouts, so a clean build is still
// offline-capable once the artifacts have been fetched a single time.
def libmpvDownloadCache = new File(gradle.gradleUserHomeDir, "caches/rn-media/libmpv-android-audio/${ext.libmpv.release}")

// Extracted `.so`s. This directory is BOTH a jniLibs source set (→ AAR) and the
// lookup root CMake imports from (→ link). See build.gradle / CMakeLists.txt.
def libmpvJniLibsDir = new File(project.buildDir, 'libmpv/jniLibs')
ext.libmpvJniLibsDir = libmpvJniLibsDir

static def downloadTo(String url, File dest) {
    // openStream() has no timeouts at all: a stalled GitHub CDN connection would
    // hang the build forever instead of failing. Set both, and retry — release
    // asset fetches are the one genuinely flaky step in an otherwise local build.
    def lastError = null
    for (int attempt = 1; attempt <= 3; attempt++) {
        try {
            def conn = new URL(url).openConnection()
            conn.setConnectTimeout(30_000)
            conn.setReadTimeout(120_000)
            conn.setRequestProperty('Accept', 'application/octet-stream')
            conn.getInputStream().withStream { input ->
                dest.withOutputStream { os -> os << input }
            }
            return
        } catch (IOException e) {
            lastError = e
            dest.delete()
            if (attempt < 3) Thread.sleep(2000L * attempt)
        }
    }
    throw new GradleException("libmpv: download failed after 3 attempts: ${url}", lastError)
}

static def sha256Of(File f) {
    def digest = MessageDigest.getInstance('SHA-256')
    f.withInputStream { input ->
        byte[] buf = new byte[1 << 16]
        int n
        while ((n = input.read(buf)) > 0) digest.update(buf, 0, n)
    }
    return digest.digest().encodeHex().toString()
}

// Captured outside the task closure: inside it, `ext` would resolve against the
// task's own extra-properties extension rather than the project's.
def pin = project.ext.libmpv
def abis = reactNativeArchitectures()

def unknownAbis = abis.findAll { !pin.sha256.containsKey(it) }
if (!unknownAbis.isEmpty()) {
    throw new GradleException("No pinned libmpv checksum for ABI(s) ${unknownAbis}. " +
        "Add them to ext.libmpv.sha256 in android/libmpv.gradle.")
}

def prepareLibmpv = tasks.register('prepareLibmpv') {
    group = 'build setup'
    description = "Download, verify and extract prebuilt libmpv ${pin.release} (${pin.flavor})"

    // Re-run when the pin or the requested ABI set changes; skip otherwise.
    inputs.property('release', pin.release)
    inputs.property('flavor', pin.flavor)
    inputs.property('sha256', abis.collectEntries { [(it): pin.sha256[it]] })
    outputs.dir(libmpvJniLibsDir)

    doLast {
        // Wipe first: shrinking `-PreactNativeArchitectures` between builds must
        // not leave a stale libmpv.so for a dropped ABI in the jniLibs source set
        // (it would be packaged into the AAR without a matching libRnMediaPlayer.so).
        libmpvJniLibsDir.deleteDir()

        abis.each { abi ->
            def assetName = "${pin.flavor}-${abi}.jar"
            def expected = pin.sha256[abi]
            def jar = new File(libmpvDownloadCache, assetName)

            if (jar.exists() && sha256Of(jar) != expected) {
                logger.lifecycle("libmpv: checksum mismatch for cached ${assetName}, re-downloading")
                jar.delete()
            }

            if (!jar.exists()) {
                def url = "https://github.com/${pin.owner}/libmpv-android-audio-build/releases/download/${pin.release}/${assetName}"
                logger.lifecycle("libmpv: downloading ${url}")
                jar.parentFile.mkdirs()
                // Download to a temp file first so an interrupted build can never
                // leave a truncated jar behind that looks cached.
                def partial = new File(jar.parentFile, "${assetName}.part")
                partial.delete()
                downloadTo(url, partial)
                def actual = sha256Of(partial)
                if (actual != expected) {
                    partial.delete()
                    throw new GradleException(
                        "libmpv: SHA-256 verification failed for ${assetName}\n" +
                        "  expected ${expected}\n  actual   ${actual}")
                }
                partial.renameTo(jar)
            }

            def outFile = new File(libmpvJniLibsDir, "${abi}/libmpv.so")
            outFile.parentFile.mkdirs()
            def entryName = "lib/${abi}/libmpv.so"
            new ZipFile(jar).withCloseable { zip ->
                def entry = zip.getEntry(entryName)
                if (entry == null) {
                    throw new GradleException("libmpv: ${assetName} does not contain ${entryName}")
                }
                // Only libmpv.so is extracted, and our fork's jars ship nothing
                // else. Upstream media-kit jars additionally carry
                // libmediakitandroidhelper.so, which is media_kit's own Flutter
                // glue (asset copying / content-URI fds) — libmpv.so has no
                // DT_NEEDED on it and we do not use it. Kept as an explicit
                // single-entry extraction so switching back to an upstream tag
                // still yields exactly libmpv.so and nothing more.
                zip.getInputStream(entry).withStream { input ->
                    outFile.withOutputStream { os -> os << input }
                }
            }
        }
    }
}

// The extracted `.so`s go into the AAR as `jni/<abi>/libmpv.so`.
// No double-packaging risk with the CMake output: externalNativeBuild only
// packages the targets it builds (libRnMediaPlayer.so), and libmpv is an
// IMPORTED target, which CMake never copies. The two sets are disjoint.
android.sourceSets.main.jniLibs.srcDirs += [libmpvJniLibsDir]

tasks.configureEach { t ->
    // CMake needs libmpv.so on disk to link; the jniLibs merge needs it to package.
    // `jniLibs.srcDirs += File` carries no task dependency, so wire it explicitly.
    if (t.name == 'preBuild' ||
        t.name ==~ /^merge.*JniLibFolders$/ ||
        t.name ==~ /^merge.*NativeLibs$/ ||
        t.name ==~ /^(configure|build)CMake.*$/ ||
        t.name ==~ /^generateJsonModel.*$/) {
        t.dependsOn(prepareLibmpv)
    }
}
